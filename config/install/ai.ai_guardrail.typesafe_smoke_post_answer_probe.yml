langcode: en
status: true
dependencies:
  enforced:
    module:
      - typesafe_smoke
id: typesafe_smoke_post_answer_probe
label: 'Smoke: post-phase probe'
description: 'Battery only: matches the score legend level "post_probe_target" that TypeSafe echoes in the G04 answer, so the block happens after the API call.'
guardrail: regexp_guardrail
guardrail_settings:
  regexp_pattern: /^post_probe_target$/
  scan_all_user_messages: false
  violation_message: 'TSS-GR-POST: post-generation probe matched.'
